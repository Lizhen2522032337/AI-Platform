name: enterprise-ai-platform

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"

  fastapi-service:
    build:
      context: ../backend/fastapi-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${DATABASE_ENV_FILE:-/etc/enterprise-ai-platform/database.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"

  gin-service:
    build:
      context: ../backend/gin-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${DATABASE_ENV_FILE:-/etc/enterprise-ai-platform/database.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"

  nest-service:
    build:
      context: ../backend/nest-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${DATABASE_ENV_FILE:-/etc/enterprise-ai-platform/database.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - fastapi-service
      - gin-service
      - nest-service
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
