name: enterprise-ai-platform

services:
  # PostgreSQL 可以由本项目托管，也可以通过 database.env 切换为外部数据库。
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: ["managed-db"]
    restart: unless-stopped
    ports:
      - "5432:5432"
    env_file:
      - ${DATABASE_ENV_FILE:-/etc/enterprise-ai-platform/database.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    ports:
      - "6379:6379"
    env_file:
      - ${PLATFORM_ENV_FILE:-/etc/enterprise-ai-platform/platform.env}
    command: ["/bin/sh", "-ec", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:4.3.4-management-alpine}
    restart: unless-stopped
    env_file:
      - ${PLATFORM_ENV_FILE:-/etc/enterprise-ai-platform/platform.env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.18.3}
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1}
    restart: unless-stopped
    env_file:
      - ${PLATFORM_ENV_FILE:-/etc/enterprise-ai-platform/platform.env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    expose:
      - "9000"

  # 一次性创建 AI 结果桶，完成后正常退出。
  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:RELEASE.2025-08-13T08-35-41Z-cpuv1}
    profiles: ["tools"]
    env_file:
      - ${PLATFORM_ENV_FILE:-/etc/enterprise-ai-platform/platform.env}
    depends_on:
      minio:
        condition: service_started
    # command 使用单元素列表，确保整段脚本作为 sh -c 的一个参数传入。
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until mc alias set local "http://$${MINIO_ENDPOINT}" "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" >/dev/null 2>&1; do
          echo "等待 MinIO 就绪"
          sleep 2
        done
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"

  # 一次性执行所有幂等 SQL 迁移。
  migrator:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: ["tools"]
    env_file:
      - ${DATABASE_ENV_FILE:-/etc/enterprise-ai-platform/database.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../database/migrations:/migrations:ro
    # command 使用单元素列表，避免 Compose 将多行脚本拆成多个 shell 参数。
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export PGHOST="$${POSTGRES_HOST}"
        export PGPORT="$${POSTGRES_PORT:-5432}"
        export PGDATABASE="$${POSTGRES_DB}"
        export PGUSER="$${POSTGRES_USER}"
        export PGPASSWORD="$${POSTGRES_PASSWORD}"
        export PGSSLMODE="$${POSTGRES_SSLMODE:-disable}"
        attempt=1
        until pg_isready >/dev/null 2>&1; do
          if [ "$${attempt}" -ge 30 ]; then echo "等待 PostgreSQL 就绪超时" >&2; exit 1; fi
          echo "等待 PostgreSQL 就绪（$${attempt}/30）"
          attempt=$$((attempt + 1))
          sleep 2
        done
        for migration in /migrations/*.sql; do
          [ -f "$${migration}" ] || continue
          echo "执行迁移：$$(basename "$${migration}")"
          psql -v ON_ERROR_STOP=1 -f "$${migration}"
        done

  frontend:
    image: ${APP_IMAGE_REGISTRY:-enterprise-ai-platform}/frontend:${APP_IMAGE_TAG:-local}
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        NGINX_BASE_IMAGE: ${NGINX_BASE_IMAGE:-nginx:alpine}
        APP_VERSION: ${APP_IMAGE_TAG:-local}
        VCS_REF: ${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  fastapi-service:
    image: ${APP_IMAGE_REGISTRY:-enterprise-ai-platform}/fastapi-service:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend/fastapi-service
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_FASTAPI_BASE_IMAGE:-python:3.13-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
        PIP_RETRIES: ${PIP_RETRIES:-8}
        APP_VERSION: ${APP_IMAGE_TAG:-local}
        VCS_REF: ${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    env_file:
      # PostgreSQL 查询 Tool 复用 Git 外 database.env，不在仓库重复保存密码。
      - ${DATABASE_ENV_FILE:-/etc/enterprise-ai-platform/database.env}
      - ${PLATFORM_ENV_FILE:-/etc/enterprise-ai-platform/platform.env}
      # 大模型与 Dify Key 只注入 FastAPI，不进入前端、NestJS、Gin 或 Worker。
      - ${LLM_ENV_FILE:-/etc/enterprise-ai-platform/llm.env}
      # DB2 与通知配置允许稍后提供；真实文件位于 Git 仓库之外。
      - path: ${AGENT_ENV_FILE:-/etc/enterprise-ai-platform/agent.env}
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # 目录文件不是环境变量，必须显式映射后 FastAPI 才能读取。
      - /etc/enterprise-ai-platform:/etc/enterprise-ai-platform:ro
    depends_on:
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  nest-service:
    image: ${APP_IMAGE_REGISTRY:-enterprise-ai-platform}/nest-service:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend/nest-service
      dockerfile: Dockerfile
      args:
        NODE_BASE_IMAGE: ${NODE_BASE_IMAGE:-node:22-alpine}
        APP_VERSION: ${APP_IMAGE_TAG:-local}
        VCS_REF: ${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    env_file:
      - ${DATABASE_ENV_FILE:-/etc/enterprise-ai-platform/database.env}
      - ${PLATFORM_ENV_FILE:-/etc/enterprise-ai-platform/platform.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      fastapi-service:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  gin-service:
    image: ${APP_IMAGE_REGISTRY:-enterprise-ai-platform}/gin-service:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend/gin-service
      dockerfile: Dockerfile
      args:
        GO_BASE_IMAGE: ${GO_BASE_IMAGE:-golang:1.26-alpine}
        ALPINE_BASE_IMAGE: ${ALPINE_BASE_IMAGE:-alpine:latest}
        APP_VERSION: ${APP_IMAGE_TAG:-local}
        VCS_REF: ${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    env_file:
      - ${PLATFORM_ENV_FILE:-/etc/enterprise-ai-platform/platform.env}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  worker:
    image: ${APP_IMAGE_REGISTRY:-enterprise-ai-platform}/worker:${APP_IMAGE_TAG:-local}
    build:
      context: ../backend/worker
      dockerfile: Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${PYTHON_WORKER_BASE_IMAGE:-python:3.11-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
        PIP_RETRIES: ${PIP_RETRIES:-8}
        APP_VERSION: ${APP_IMAGE_TAG:-local}
        VCS_REF: ${APP_IMAGE_TAG:-local}
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    env_file:
      - ${DATABASE_ENV_FILE:-/etc/enterprise-ai-platform/database.env}
      - ${PLATFORM_ENV_FILE:-/etc/enterprise-ai-platform/platform.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      fastapi-service:
        condition: service_healthy
    expose:
      - "8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  nginx:
    image: ${NGINX_BASE_IMAGE:-nginx:alpine}
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      nest-service:
        condition: service_healthy
      gin-service:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  qdrant_data:
  minio_data:
