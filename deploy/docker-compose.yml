name: enterprise-ai-platform

services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  fastapi-service:
    build:
      context: ../backend/fastapi-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${DATABASE_ENV_FILE:-/etc/enterprise-ai-platform/database.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  gin-service:
    build:
      context: ../backend/gin-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${DATABASE_ENV_FILE:-/etc/enterprise-ai-platform/database.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nest-service:
    build:
      context: ../backend/nest-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ${DATABASE_ENV_FILE:-/etc/enterprise-ai-platform/database.env}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      fastapi-service:
        condition: service_healthy
      gin-service:
        condition: service_healthy
      nest-service:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
