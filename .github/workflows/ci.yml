name: Enterprise CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - agent/**

permissions:
  contents: read

concurrency:
  group: enterprise-ai-platform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-scripts:
    name: Deployment scripts / Bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: 校验全部部署脚本语法
        run: bash -n deploy/scripts/*.sh deploy/scripts/lib/*.sh
      - name: 校验更新入口强制重建契约
        shell: bash
        run: |
          for entry in deploy/scripts/update-*.sh; do
            grep -q 'prepare_update' "${entry}" || {
              echo "${entry} 未接入统一更新入口" >&2
              exit 1
            }
          done
          grep -q -- '--force-recreate' deploy/scripts/lib/common.sh
          grep -q 'assert_service_recreated' deploy/scripts/lib/common.sh
      - name: 验证合法 LLM 配置不会触发静默退出
        shell: bash
        run: |
          test_env="$(mktemp)"
          trap 'rm -f "${test_env}"' EXIT
          cat >"${test_env}" <<'EOF'
          DEEPSEEK_API_KEY=test-deepseek-key
          DEEPSEEK_BASE_URL=https://example.invalid/v1
          DEEPSEEK_MODEL=deepseek-test
          QWEN_API_KEY=test-qwen-key
          QWEN_BASE_URL=https://example.invalid/v1
          QWEN_MODEL=qwen-test
          EMBEDDING_API_KEY=test-embedding-key
          EMBEDDING_BASE_URL=https://example.invalid/v1
          EMBEDDING_MODEL=embedding-test
          EMBEDDING_DIMENSION=1024
          EMBEDDING_REQUEST_TIMEOUT_SECONDS=60
          KNOWLEDGE_CONFIG_FILE=/tmp/knowledge-base.json
          LLM_REQUEST_TIMEOUT_SECONDS=300
          LLM_MAX_TOKENS=2048
          EOF
          export LLM_ENV_FILE="${test_env}"
          source deploy/scripts/lib/common.sh
          ensure_llm_env

  fastapi:
    name: FastAPI / Python 3.13
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/fastapi-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/fastapi-service/requirements-dev.lock
      - name: 校验 Python 锁文件清单
        working-directory: .
        run: python tools/update_python_lock_manifest.py --check
      - name: 安装哈希锁定依赖
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: 静态检查
        run: ruff check app tests
      - name: 单元测试
        run: python -m pytest -q

  worker:
    name: Worker / Python 3.11
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/worker/requirements-dev.lock
      - name: 安装哈希锁定依赖
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: 单元测试
        run: python -m pytest -q

  nest:
    name: NestJS / Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/nest-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/nest-service/package-lock.json
      - run: npm ci --no-audit
      - run: npm test -- --runInBand
      - run: npm run build

  frontend:
    name: React / Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm run build

  gin:
    name: Gin / Go 1.26
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/gin-service
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache-dependency-path: backend/gin-service/go.sum
      - run: go test ./...
      - run: go vet ./...

  container-images:
    name: Container / ${{ matrix.service }}
    needs: [deployment-scripts, fastapi, worker, nest, frontend, gin]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: frontend
            context: frontend
          - service: fastapi-service
            context: backend/fastapi-service
          - service: nest-service
            context: backend/nest-service
          - service: gin-service
            context: backend/gin-service
          - service: worker
            context: backend/worker
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - name: 构建生产镜像但不推送
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: false
          tags: enterprise-ai-platform/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
